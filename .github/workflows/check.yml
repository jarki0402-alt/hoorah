# Every push to main: lint, typecheck and unit tests, as a safety net before updating the VM.
# Nothing is built or published here: the VM builds its own image (deploy/vm/update.sh, DEPLOY.md).
# End-to-end tests (real browsers) stay on the laptop: npm run e2e.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
