# Local Docker (the laptop): /etc/nginx/conf.d/default.conf of the `web` container, published on :1010.
# Plain HTTP, reached on the Wi-Fi or through Cloudflare Tunnel (cloudflared on the host). The Hoorah rules
# themselves are shared with the VM: deploy/nginx/hoorah-server.conf.

upstream hoorah_server {
    server server:8790;
    keepalive 16;
}

map $http_upgrade $hoorah_connection {
    default upgrade;
    "" "";
}

# cloudflared says https in X-Forwarded-Proto; on the Wi-Fi there is no header and the scheme is http.
map $http_x_forwarded_proto $hoorah_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $arg_v $hoorah_models_cache {
    "" "no-cache";
    default "public, max-age=31536000, immutable";
}

limit_req_zone $binary_remote_addr zone=hoorah_req:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=hoorah_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=hoorah_conn:10m;

server {
    listen 80 default_server;
    server_name _;

    # Every visitor arrives from Docker's gateway (cloudflared on the host, or Docker Desktop's NAT). Trust the
    # private hops and take the visitor's address from Cloudflare's header when the tunnel sends one, so the
    # per-address limits and "nearby screens" see each player separately.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    real_ip_header CF-Connecting-IP;

    root /srv;

    include /etc/nginx/hoorah/hoorah-server.conf;
}
