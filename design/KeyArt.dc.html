<script type="text/x-dc" data-dc-script data-props='{"game":{"editor":"enum","options":["tarik","kuis","rusun","bajaj","gambar","panjat"],"default":"tarik"},"w":{"editor":"int","default":640,"min":120,"max":1920},"logo":{"editor":"boolean","default":true},"round":{"editor":"int","default":0,"min":0,"max":40},"$preview":{"width":640,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const game = this.props.game || 'tarik';
    const w = Number(this.props.w ?? 640);
    const h = Math.round(w * 9 / 16);
    const t = {};
    if (game === 'tarik') {
      const yAt = (x) => { const u = x / 640; return 30 + 68 * u * (1 - u); };
      let red = '', white = '';
      for (let i = 0, x = 12; x < 640; x += 30, i++) {
        const y = yAt(x);
        const tri = `M${x - 10} ${y.toFixed(1)} L${x + 10} ${y.toFixed(1)} L${x} ${(y + 18).toFixed(1)}Z `;
        if (i % 2) white += tri; else red += tri;
      }
      t.buntRed = red; t.buntWhite = white;
      let posts = '';
      for (let x = 8; x < 640; x += 36) posts += `M${x} 206 h7 v40 h-7Z `;
      t.posts = posts;
      const bodies = ['', '', '', '', ''], heads = ['', '', '', ''];
      let hair = '', sticks = '', fr = '', fw = '';
      for (let i = 0; i < 24; i++) {
        const x = 22 + i * 26, y = 186 + ((i * 7) % 5) - 2;
        bodies[i % 5] += `M${x - 10} ${y + 30} v-10 q0 -12 10 -12 q10 0 10 12 v10Z `;
        heads[(i * 3) % 4] += `M${x - 8} ${y} a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0Z `;
        hair += `M${x - 8} ${y - 1} a8 8 0 0 1 16 0 q-8 -4 -16 0Z `;
        if (i % 4 === 1) {
          sticks += `M${x + 9} ${y + 10} V${y - 22} `;
          fr += `M${x + 9} ${y - 22} h13 v5 h-13Z `;
          fw += `M${x + 9} ${y - 17} h13 v5 h-13Z `;
        }
      }
      bodies.forEach((d, i) => { t['body' + i] = d; });
      heads.forEach((d, i) => { t['head' + i] = d; });
      t.hair = hair; t.sticks = sticks; t.flagRed = fr; t.flagWhite = fw;
    }
    const k = {};
    if (game === 'kuis') {
      let v = 'M0 0 H640 V22 ';
      for (let x = 640; x > 0; x -= 40) v += `Q${x - 20} 40 ${x - 40} 22 `;
      k.valance = v + 'Z';
      let b = '';
      const dot = (x, y) => `M${x - 3.2} ${y} a3.2 3.2 0 1 0 6.4 0 a3.2 3.2 0 1 0 -6.4 0Z `;
      for (let x = 180; x <= 460; x += 20) { b += dot(x, 46); b += dot(x, 212); }
      for (let y = 66; y <= 192; y += 21) { b += dot(170, y); b += dot(470, y); }
      k.bulbs = b;
    }
    const r = {};
    if (game === 'rusun') {
      const rect = (x, y, rw, rh) => `M${x.toFixed(1)} ${y.toFixed(1)} h${rw.toFixed(1)} v${rh.toFixed(1)} h${(-rw).toFixed(1)}Z `;
      const floor = (x, y, fw, fh, i) => {
        const o = { wall: rect(x, y, fw, fh - 4), frames: '', glass: '', rope: '', cr: '', cy: '', cw: '', ac: '', slab: rect(x - 3, y + fh - 4, fw + 6, 4) };
        const winW = fh * 0.5, winH = fh * 0.46;
        const n = Math.max(2, Math.floor((fw - 16) / (winW + 16)));
        const gap = (fw - 16) / n;
        for (let k2 = 0; k2 < n; k2++) {
          const wx = x + 8 + k2 * gap + (gap - winW) / 2, wy = y + fh * 0.14;
          o.frames += rect(wx, wy, winW, winH);
          o.glass += rect(wx + 2, wy + 2, winW - 4, winH - 4);
        }
        if (i % 2 === 0) {
          const ly = y + fh * 0.7;
          o.rope += `M${(x + 6).toFixed(1)} ${ly.toFixed(1)} H${(x + fw - 6).toFixed(1)} `;
          const cols = ['cr', 'cy', 'cw'];
          for (let p = 0, px = x + 12; px < x + fw - 16; px += 14, p++) o[cols[p % 3]] += rect(px, ly, 6, fh * 0.16);
        }
        if (i % 3 === 1) o.ac += rect(x + fw - 18, y + fh * 0.5, 11, 8);
        return o;
      };
      const keys = ['frames', 'glass', 'rope', 'cr', 'cy', 'cw', 'ac', 'slab'];
      keys.forEach((kk) => { r[kk] = ''; });
      r.wall0 = ''; r.wall1 = ''; r.wall2 = '';
      const widths = [232, 214, 196, 178, 160, 142];
      const offs = [0, 4, -3, 6, 2, -5];
      widths.forEach((fw, i) => {
        const o = floor(320 - fw / 2 + offs[i], 326 - (i + 1) * 36, fw, 36, i);
        r['wall' + (i % 3)] += o.wall;
        keys.forEach((kk) => { r[kk] += o[kk]; });
      });
      const s = floor(446 - 62, 72, 124, 36, 1);
      r.swing = s.wall; r.swingFrames = s.frames; r.swingGlass = s.glass; r.swingSlab = s.slab;
    }
    return {
      w, h, wpx: w + 'px', hpx: h + 'px', radius: (this.props.round ?? 0) + 'px',
      t, k, r, isRusun: game === 'rusun',
      logoOpacity: this.props.logo === false ? 0 : 1,
      isTarik: game === 'tarik', isKuis: game === 'kuis', isBajaj: game === 'bajaj', isGambar: game === 'gambar', isPanjat: game === 'panjat'
    };
  }
}
</script>
