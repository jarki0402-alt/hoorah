<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tarik Tambang permainan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC928}a:hover{color:#FFF7F0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; background: #111214; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">

<div style="position: absolute; left: 0; top: 0"><dc-import name="KeyArt" game="tarik" w="{{full}}" logo="{{false}}" hint-size="1280px,720px"></dc-import></div>

<div style="position: absolute; left: 20px; right: 20px; top: 16px; display: grid; grid-template-columns: 1fr 200px 1fr; gap: 10px; align-items: stretch">
<div style="display: flex; align-items: center; gap: 12px; background: rgba(17,18,20,0.9); border-radius: 16px; padding: 10px 14px; box-shadow: inset 6px 0 0 #F2453D">
<dc-import name="Avatar" fruit="semangka" size="{{av}}" ring="#F2453D" hint-size="46px,46px"></dc-import>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><div style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #FF8A84">TIM MERAH</div><div style="font-size: 15px; font-weight: 800">Rina</div><div style="margin-left: auto; display: flex; gap: 3px"><svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Menang 1 ronde"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z" fill="#FFC928"></path></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z" fill="none" stroke="#5B5E66" stroke-width="2"></path></svg></div></div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{segRed}}" as="s" hint-placeholder-count="10"><div style="height: 10px; border-radius: 3px; background: {{s}}"></div></sc-for>
</div>
<div style="font-size: 13px; font-weight: 800; white-space: nowrap">7,4<span style="color: #A8ABB2; font-weight: 600">/dtk</span></div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(17,18,20,0.9); border-radius: 16px; padding: 6px">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #A8ABB2">RONDE 2 / 3</div>
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #FFC928">0:42</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; background: rgba(17,18,20,0.9); border-radius: 16px; padding: 10px 14px; box-shadow: inset -6px 0 0 #2F8CFF">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><div style="display: flex; gap: 3px"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z" fill="none" stroke="#5B5E66" stroke-width="2"></path></svg><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6 Z" fill="none" stroke="#5B5E66" stroke-width="2"></path></svg></div><div style="margin-left: auto; font-size: 15px; font-weight: 800">Budi</div><div style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #8CC4FF">TIM BIRU</div></div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="font-size: 13px; font-weight: 800; white-space: nowrap">6,1<span style="color: #A8ABB2; font-weight: 600">/dtk</span></div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{segBlue}}" as="s" hint-placeholder-count="10"><div style="height: 10px; border-radius: 3px; background: {{s}}"></div></sc-for>
</div>
</div>
</div>
<dc-import name="Avatar" fruit="alpukat" size="{{av}}" ring="#2F8CFF" hint-size="46px,46px"></dc-import>
</div>
</div>

<div style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: 0; border-radius: 50%; border: 6px solid #FFFFFF; opacity: 0.9"></div>
<div style="position: absolute; inset: 22px; border-radius: 50%; border: 8px solid #FFC928; box-shadow: 0 0 0 4px rgba(17,18,20,0.35)"></div>
<div style="width: 26px; height: 26px; border-radius: 50%; background: #FFC928; border: 3px solid #111214"></div>
</div>
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #FFC928; -webkit-text-stroke: 6px #111214; paint-order: stroke fill">SUPER TARIK!</div>
<div style="font-size: 13px; font-weight: 800; color: #111214; background: #FFF7F0; border-radius: 999px; padding: 4px 12px">Ketuk saat cincin kuning pas di garis putih</div>
</div>

<div style="position: absolute; left: 286px; top: 236px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #FFFFFF; -webkit-text-stroke: 6px #111214; paint-order: stroke fill; transform: rotate(-8deg)">+3</div>
<div style="position: absolute; left: 236px; top: 286px; font-size: 13px; font-weight: 800; color: #111214; background: #FFC928; border: 2px solid #111214; border-radius: 8px; padding: 3px 8px; transform: rotate(-6deg)">KOMBO x4</div>
<div style="position: absolute; left: 940px; top: 256px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #FFFFFF; -webkit-text-stroke: 5px #111214; paint-order: stroke fill; transform: rotate(6deg)">+1</div>

<div style="position: absolute; left: 20px; bottom: 18px; display: flex; align-items: center; gap: 10px; max-width: 420px; background: rgba(17,18,20,0.9); border-radius: 14px; padding: 10px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC928" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11 a7 7 0 0 0 14 0 M12 18 V21"></path></svg>
<div style="font-size: 14px; line-height: 1.35"><b>Rina</b> 3 kali super beruntun! Budi, jangan kendor!</div>
</div>

<div style="position: absolute; right: 20px; bottom: 18px; width: 460px; display: flex; flex-direction: column; gap: 6px; background: rgba(17,18,20,0.9); border-radius: 14px; padding: 10px 14px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: 0.04em"><span style="color: #FF8A84">GARIS MERAH</span><span style="color: #DADCE0">Merah unggul 8%</span><span style="color: #8CC4FF">GARIS BIRU</span></div>
<div role="img" aria-label="Posisi bendera: Merah unggul delapan persen" style="position: relative; height: 16px; border-radius: 999px; background: #2F8CFF; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; background: #F2453D"></div>
<div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.7)"></div>
</div>
<div style="position: relative; height: 0">
<div style="position: absolute; left: 58%; top: -30px; transform: translateX(-50%); width: 14px; height: 22px; background: #FFC928; border: 2px solid #111214; border-radius: 3px 3px 7px 7px"></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const seg = (n, c) => Array.from({ length: 10 }, (_, i) => (i < n ? c : '#2A2B30'));
    return { full: 1280, av: 46, segRed: seg(7, '#F2453D'), segBlue: seg(6, '#2F8CFF').reverse() };
  }
}
</script>
</body>
</html>
