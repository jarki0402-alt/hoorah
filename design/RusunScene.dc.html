<!doctype html>
<html lang="id">
<head>

<body>
<x-dc>

<g fill="#2E9E4F"><path d="M176 520 C150 500 120 504 100 520 C126 512 150 514 176 522Z"></path><path d="M176 520 C196 494 228 492 250 506 C224 502 200 508 176 522Z"></path><path d="M176 520 C170 490 180 470 196 460 C188 482 184 500 178 522Z"></path><path d="M176 520 C150 530 136 556 136 576 C146 552 160 536 178 524Z"></path></g>

<rect x="0" y="676" width="1280" height="12" fill="#C9CCD1"></rect>

</g>

<path d="M240 16 H1180 V44 H240Z" fill="none" stroke="#111214" stroke-width="2.5"></path>
<rect x="246" y="44" width="70" height="30" fill="#9AA0A6" stroke="#111214" stroke-width="2"></rect>

<sc-for list="{{floors}}" as="f" hint-placeholder-count="11">
<svg style="position: absolute; left: {{f.left}}; top: {{f.top}}; transform: rotate({{f.rot}}); transform-origin: 50% 100%; overflow: visible" width="{{f.sw}}" height="50" viewBox="{{f.vb}}" aria-hidden="true">

<path d="{{f.shade}}" fill="{{f.shadeColor}}"></path>
<path d="{{f.topShadow}}" fill="#111214" opacity="0.14"></path>
<path d="{{f.stain}}" fill="#111214" opacity="0.08"></path>
<path d="{{f.pipe}}" fill="#9AA0A6"></path>
<path d="{{f.shut}}" fill="#2DA39A"></path>
<path d="{{f.shutLine}}" fill="none" stroke="#1C7C74" stroke-width="1"></path>
<path d="{{f.frame}}" fill="#2B3A55"></path>
<path d="{{f.glass}}" fill="#8EC9E8"></path>
<path d="{{f.curtR}}" fill="#F2453D"></path>
<path d="{{f.curtY}}" fill="#FFC928"></path>
<path d="{{f.headO}}" fill="#FF9A1F"></path>
<path d="{{f.leaf}}" fill="#2E9E4F"></path>
<path d="{{f.eyes}}" fill="#111214"></path>
<path d="{{f.glare}}" fill="#FFFFFF" opacity="0.55"></path>
<path d="{{f.mull}}" fill="#2B3A55"></path>
<path d="{{f.sill}}" fill="#EDE3D3"></path>
<path d="{{f.awnR}}" fill="#E8352E"></path>
<path d="{{f.awnW}}" fill="#FFFFFF"></path>
<path d="{{f.roll}}" fill="#A8ADB4"></path>
<path d="{{f.rollLine}}" fill="none" stroke="#878C93" stroke-width="1.2"></path>
<path d="{{f.door}}" fill="#7A4A1E"></path>
<path d="{{f.disp}}" fill="#BFE6FF"></path>
<text x="{{f.signX}}" y="35" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="10" fill="#2B3A55">{{f.sign}}</text>
<path d="{{f.rope}}" fill="none" stroke="#5A4A3C" stroke-width="1"></path>
<path d="{{f.cr}}" fill="#F2453D"></path>
<path d="{{f.cy}}" fill="#FFC928"></path>
<path d="{{f.cb}}" fill="#2F8CFF"></path>
<path d="{{f.cw}}" fill="#FFFFFF" stroke="#C9CCD1" stroke-width="0.6"></path>
<path d="{{f.rail}}" fill="#3C3E44"></path>
<path d="{{f.pot}}" fill="#B5532A"></path>
<path d="{{f.plant}}" fill="#2E9E4F"></path>
<path d="{{f.plant2}}" fill="#4FAE52"></path>
<path d="{{f.ac}}" fill="#E9EAEC" stroke="#9AA0A6" stroke-width="1"></path>
<path d="{{f.acLine}}" fill="none" stroke="#9AA0A6" stroke-width="1"></path>
<path d="{{f.slab}}" fill="#6B5B4B"></path>
<path d="{{f.slabHi}}" fill="#8A7865"></path>
<path d="{{f.wBody}}" fill="#2F8CFF" stroke="#111214" stroke-width="1"></path>
<path d="{{f.wHead}}" fill="#FF9A1F" stroke="#111214" stroke-width="1"></path>
<path d="{{f.wHelmet}}" fill="#FFC928" stroke="#111214" stroke-width="1"></path>
<path d="{{f.wEyes}}" fill="#111214"></path>
</svg>

<svg style="position: absolute; left: 0; top: 0" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true">
<path d="{{dust}}" fill="#F3EEE6"></path>
<path d="{{debris}}" fill="#6B5B4B"></path>
<path d="{{spark}}" fill="#FFC928" stroke="#111214" stroke-width="1.5"></path>
</svg>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1280,"min":160,"max":1920},"roboh":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1280), h = Math.round(w * 9 / 16);
    const roboh = this.props.roboh === true;
    const f1 = (n) => Math.round(n * 10) / 10;
    const rect = (x, y, rw, rh) => `M${f1(x)} ${f1(y)}h${f1(rw)}v${f1(rh)}h${f1(-rw)}Z `;
    const circ = (cx, cy, r) => `M${f1(cx - r)} ${f1(cy)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z `;
    const KEYS = ['wall','shade','topShadow','stain','frame','glass','mull','glare','sill','curtR','curtY','shut','shutLine','headO','leaf','eyes','rail','pot','plant','plant2','rope','cr','cy','cb','cw','ac','acLine','pipe','awnR','awnW','roll','rollLine','door','disp','slab','slabHi','wBody','wHead','wHelmet','wEyes'];
    const walls = ['#F4E1C1', '#FFD6A5', '#CDE7F0', '#E4F1D4'];
    const shades = ['#DCC6A3', '#E8B985', '#A9CDDB', '#C5DDB0'];
    const parts = (fw, i, workers) => {
      const o = {};
      KEYS.forEach((k) => { o[k] = ''; });
      o.sign = ''; o.signX = 0;
      const X = 6, WH = 44, inner = fw * 0.84;
      o.wall = rect(X, 0, fw, WH);
      o.shade = rect(X + inner, 0, fw - inner, WH);
      o.topShadow = rect(X, 0, fw, 4);
      o.stain = rect(X + fw * 0.22, 38, 12, 3) + rect(X + fw * 0.64, 5, 7, 2) + rect(X + fw * 0.45, 40, 6, 2);
      o.pipe = rect(X + fw * 0.9, 0, 3.5, WH) + rect(X + fw * 0.9 - 1.5, 12, 6.5, 2) + rect(X + fw * 0.9 - 1.5, 32, 6.5, 2);
      if (i === 0) {
        for (let s = X, n = 0; s < X + inner - 2; s += 14, n++) {
          const sw = Math.min(14, X + inner - s);
          const piece = rect(s, 4, sw, 8) + `M${f1(s)} 12a${f1(sw / 2)} 4 0 0 0 ${f1(sw)} 0Z `;
          if (n % 2) o.awnW += piece; else o.awnR += piece;
        }
        const rx = X + fw * 0.06, rw = fw * 0.42;
        o.roll = rect(rx, 17, rw, 27);
        for (let y = 20; y < 44; y += 3) o.rollLine += `M${f1(rx)} ${y}h${f1(rw)} `;
        o.sign = 'WARUNG SEMBAKO'; o.signX = f1(rx + rw / 2);
        o.door = rect(X + fw * 0.54, 17, 22, 27) + circ(X + fw * 0.54 + 18, 31, 1.4);
        o.disp = rect(X + fw * 0.64, 18, fw * 0.17, 16);
        o.frame = rect(X + fw * 0.64 - 2, 16, fw * 0.17 + 4, 20);
      } else {
        const n = Math.max(2, Math.floor((inner - 10) / 40));
        const gap = (inner - 10) / n;
        for (let k = 0; k < n; k++) {
          const wx = X + 6 + k * gap + (gap - 22) / 2, wy = 7;
          if ((i * 3 + k) % 5 === 2) {
            o.shut += rect(wx - 9, wy - 1, 7, 24) + rect(wx + 24, wy - 1, 7, 24);
            for (let j = 0; j < 5; j++) o.shutLine += `M${f1(wx - 9)} ${f1(wy + 3 + j * 4)}h7 M${f1(wx + 24)} ${f1(wy + 3 + j * 4)}h7 `;
          }
          o.frame += rect(wx - 1.5, wy - 1.5, 25, 25);
          o.glass += rect(wx + 0.5, wy + 0.5, 21, 21);
          if ((i + k) % 4 === 1) o.curtR += rect(wx + 0.5, wy + 0.5, 8, 21);
          if ((i + k) % 4 === 3) o.curtY += rect(wx + 12.5, wy + 0.5, 8.5, 21);
          const res = (i === 2 && k === 1) || (i === 5 && k === 0) || (i === 7 && k === n - 1) || (i === 9 && k === 1);
          if (res) {
            const cx = wx + 11, cy = wy + 15;
            o.headO += circ(cx, cy, 6.5);
            o.leaf += `M${f1(cx + 1)} ${f1(cy - 6)}q3 -5 7 -3q-3 4 -7 3Z `;
            o.eyes += circ(cx - 2.4, cy - 0.5, 1.1) + circ(cx + 2.4, cy - 0.5, 1.1);
          }
          o.glare += `M${f1(wx + 3)} ${f1(wy + 16)}L${f1(wx + 12)} ${f1(wy + 3)}L${f1(wx + 16)} ${f1(wy + 3)}L${f1(wx + 7)} ${f1(wy + 16)}Z `;
          o.mull += rect(wx + 10.3, wy, 1.4, 22);
          o.sill += rect(wx - 3, wy + 23, 28, 3);
        }
        if (i % 2 === 0) {
          o.rail += rect(X + 2, 33, inner - 4, 2.2);
          for (let x = X + 4; x < X + inner - 2; x += 6) o.rail += rect(x, 35, 1.4, 9);
          o.pot += rect(X + 8, 38, 9, 6) + rect(X + inner - 18, 38, 9, 6);
          o.plant += circ(X + 12.5, 34, 5) + circ(X + inner - 13.5, 34, 5);
          o.plant2 += circ(X + 9, 36, 3.4) + circ(X + 16, 35, 3.4) + circ(X + inner - 17, 36, 3.4) + circ(X + inner - 10, 35, 3.4);
        } else {
          o.rope += `M${f1(X + 6)} 33H${f1(X + inner - 4)} `;
          const cols = ['cr', 'cy', 'cb', 'cw'];
          for (let p = 0, px = X + 12; px < X + inner - 16; px += 17, p++) {
            o[cols[p % 4]] += `M${f1(px)} 33h8l3 3l-2 2l-1 -1v6h-8v-6l-1 1l-2 -2Z `;
          }
        }
        if (i % 3 === 1) {
          const ax = X + inner - 30;
          o.ac += rect(ax, 31, 18, 11);
          o.acLine += `M${f1(ax + 3)} 34h12 M${f1(ax + 3)} 36.5h12 M${f1(ax + 3)} 39h12 `;
        }
      }
      o.slab = rect(0, WH, fw + 12, 6);
      o.slabHi = rect(0, WH, fw + 12, 1.6);
      if (workers) {
        [fw * 0.3, fw * 0.62].forEach((wxp) => {
          const cx = X + wxp;
          o.wBody += rect(cx - 6, -16, 12, 16);
          o.wHead += circ(cx, -23, 7);
          o.wHelmet += `M${f1(cx - 8)} -26a8 8 0 0 1 16 0Z `;
          o.wEyes += circ(cx - 2.5, -22, 1.1) + circ(cx + 2.5, -22, 1.1);
        });
      }
      return o;
    };
    const H = 50, base = 680, cx = 640;
    const offs = roboh ? [0, 8, 4, 16, 14, 28] : [0, 5, -3, 8, 2, -6, 10, 4, -8, 12];
    const fall = [[50, 10, 10], [150, 56, 30], [260, 140, 56], [360, 240, 84]];
    const floors = [];
    for (let i = 0; i < 10; i++) {
      const fw = 400 - 18 * i;
      let dx = 0, dy = 0, rot = 0;
      if (roboh) {
        if (i < 6) { dx = offs[i]; rot = i * 0.8; } else { const f = fall[i - 6]; dx = 28 + f[0]; dy = f[1]; rot = f[2]; }
      } else dx = offs[i];
      floors.push({ ...parts(fw, i, false), color: walls[i % 4], shadeColor: shades[i % 4], sw: fw + 12, vb: `0 0 ${fw + 12} ${H}`, left: f1(cx - fw / 2 - 6 + dx) + 'px', top: f1(base - (i + 1) * H + dy) + 'px', rot: rot + 'deg' });
    }
    if (!roboh) {
      const fw = 220;
      floors.push({ ...parts(fw, 10, true), color: walls[2], shadeColor: shades[2], sw: fw + 12, vb: `0 0 ${fw + 12} ${H}`, left: f1(760 - fw / 2 - 6) + 'px', top: '96px', rot: '6deg' });
    }
    let jib = '';
    for (let x = 240; x < 1180; x += 22) jib += `M${x} 22 L${x + 11} 38 L${x + 22} 22 `;
    const cables = roboh ? 'M761 58 V96' : 'M761 58 V70 M765 76 L656 84 M765 76 L874 106';
    const hook = roboh ? 'M752 96 h18 v10 h-18Z' : 'M754 66 h22 v12 h-22Z';
    const bld = [[40, 470, 70], [118, 446, 54], [180, 500, 80], [960, 480, 64], [1032, 440, 60], [1100, 490, 90], [1196, 456, 84]];
    let cityBld = '', cityWin = '';
    bld.forEach(([x, y, bw]) => {
      cityBld += rect(x, y, bw, 620 - y);
      for (let yy = y + 10; yy < 600; yy += 18) for (let xx = x + 8; xx < x + bw - 8; xx += 14) cityWin += rect(xx, yy, 6, 8);
    });
    const houses = [[0, 616, 110], [96, 630, 120], [210, 622, 90], [840, 626, 110], [940, 614, 130], [1060, 630, 100], [1150, 620, 130]];
    let houseWall = '', houseShade = '', houseWin = '', roof = '', roofLine = '';
    houses.forEach(([x, y, hw]) => {
      houseWall += rect(x, y, hw, 676 - y);
      houseShade += rect(x + hw * 0.8, y, hw * 0.2, 676 - y);
      houseWin += rect(x + hw * 0.2, y + 14, 14, 14) + rect(x + hw * 0.52, y + 14, 14, 14);
      roof += `M${x - 8} ${y} L${x + hw / 2} ${y - 34} L${x + hw + 8} ${y}Z `;
      for (let k = 1; k < 4; k++) roofLine += `M${f1(x - 8 + k * 6)} ${f1(y - k * 8)} H${f1(x + hw + 8 - k * 6)} `;
    });
    let dust = '', debris = '', spark = '';
    if (roboh) {
      [[900, 650, 40], [960, 630, 52], [1030, 646, 44], [1090, 656, 34], [850, 664, 30], [1000, 600, 30]].forEach(([x, y, r]) => { dust += circ(x, y, r); });
      [[880, 560, 20], [930, 520, 40], [1010, 540, 15], [1060, 500, 60], [840, 600, 30], [1120, 580, 10]].forEach(([x, y, r]) => { debris += `M${x} ${y}l10 ${r % 7}l-3 9l-9 -4Z `; });
    } else {
      [[536, 180, 9], [552, 174, 7], [748, 178, 8], [764, 172, 6]].forEach(([x, y, r]) => { dust += circ(x, y, r); });
      const star = (x, y, r) => `M${x} ${y - r}L${x + r * 0.3} ${y - r * 0.3}L${x + r} ${y}L${x + r * 0.3} ${y + r * 0.3}L${x} ${y + r}L${x - r * 0.3} ${y + r * 0.3}L${x - r} ${y}L${x - r * 0.3} ${y - r * 0.3}Z `;
      spark = star(600, 158, 12) + star(708, 150, 9) + star(660, 140, 6);
    }
    return { wpx: w + 'px', hpx: h + 'px', scale: w / 1280, floors, jib, cables, hook, cityBld, cityWin, houseWall, houseShade, houseWin, roof, roofLine, dust, debris, spark };
  }
}
</script>
