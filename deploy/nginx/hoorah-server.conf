# Hoorah inside an nginx `server { }` block: the same rules on the laptop (docker/nginx.conf) and on the VM
# (deploy/nginx/hoorah.fajarrizky.my.id), so what is tried locally is what runs in production.
#
# The including file must define, at http level (names start with hoorah_ so they never clash with Suwwara's):
#   upstream hoorah_server                 where the Node server listens
#   map $http_upgrade $hoorah_connection   "upgrade" for WebSocket requests, "" otherwise (keeps upstream keepalive)
#   map ... $hoorah_proto                  the scheme the visitor used (https behind TLS or a tunnel)
#   map $arg_v $hoorah_models_cache        immutable caching for content-hashed 3D model URLs
#   zones hoorah_req, hoorah_api, hoorah_conn
# and set `root` to the built web files.

index index.html;
charset utf-8;
# Redirects (/admin -> /admin/, /sim -> /sim/) keep the address the visitor used: behind Docker's :1010 or a tunnel,
# nginx's own idea of host and port is wrong.
absolute_redirect off;
server_tokens off;
client_max_body_size 64k;
limit_req_status 429;
limit_conn_status 429;

# Build output ships .gz next to every compressible file (scripts/precompress.mjs), so the VM's small CPU never
# compresses the same file twice. On-the-fly gzip stays on for the API's JSON.
gzip_static on;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json
  application/wasm model/gltf-binary;

# Everything sent to the Node server. The server takes the visitor's address from the first X-Forwarded-For entry,
# so it is overwritten here (never appended): a visitor cannot forge it to dodge the per-address limits.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $hoorah_connection;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $hoorah_proto;

# Real-time link (screens and phones). One connection per device; a party behind one router shares an address, and
# with a Hoorah Pass a room holds 16 players plus spectators.
location = /ws {
    limit_conn hoorah_conn 100;
    proxy_pass http://hoorah_server;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /health {
    proxy_pass http://hoorah_server;
    access_log off;
}

location /api/ {
    limit_req zone=hoorah_api burst=60 nodelay;
    proxy_pass http://hoorah_server;
}

# Every static location repeats its headers (nginx drops inherited add_header as soon as a block sets its own):
# nosniff so a browser never guesses a file's type, and no full page address sent to other sites.

# Hashed build files never change: cached for a year.
location /assets/ {
    limit_req zone=hoorah_req burst=300 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

# 3D model packs: typed so browsers (and gzip) treat them right; cached for a year when the URL carries their hash.
location /models/ {
    limit_req zone=hoorah_req burst=300 nodelay;
    types {
        model/gltf-binary glb;
    }
    default_type application/octet-stream;
    add_header Cache-Control $hoorah_models_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

# The dashboard: always fresh, never framed by another site, never indexed.
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    limit_req zone=hoorah_req burst=300 nodelay;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /admin/index.html;
}

# Pages (one address for every device, games, simulator): revalidated on every visit so phones pick up new builds.
location / {
    limit_req zone=hoorah_req burst=300 nodelay;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
}
